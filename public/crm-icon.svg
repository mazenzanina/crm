<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#2e1065"/>
      <stop offset="60%" stopColor="#13092b"/>
      <stop offset="100%" stopColor="#070410"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a"/>
      <stop offset="50%" stopColor="#eab308"/>
      <stop offset="100%" stopColor="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8b5cf6"/>
      <stop offset="50%" stopColor="#6d28d9"/>
      <stop offset="100%" stopColor="#4c1d95"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4ade80"/>
      <stop offset="100%" stopColor="#16a34a"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Background Container (Squircle / iOS / PWA style) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Subtle Outer Astro Astrolabe Ring -->
  <circle cx="256" cy="235" r="150" fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="4 6" opacity="0.5"/>
  <circle cx="256" cy="235" r="175" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.3"/>

  <!-- Back Rotated Tarot Card -->
  <g transform="translate(256, 235) rotate(-14) translate(-256, -235)">
    <rect x="196" y="140" width="120" height="190" rx="14" fill="#1b1236" stroke="#4c1d95" stroke-width="3"/>
    <rect x="206" y="150" width="100" height="170" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Front Main Tarot Card -->
  <g transform="translate(256, 235) rotate(7) translate(-256, -235)" filter="url(#softGlow)">
    <rect x="196" y="135" width="120" height="190" rx="14" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="3.5"/>
    <rect x="204" y="143" width="104" height="174" rx="10" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.8"/>
    
    <!-- Sacred Eye & Mystic Moon Inside Card -->
    <circle cx="256" cy="205" r="24" fill="#0f0722" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M 244 205 Q 256 193 268 205 Q 256 217 244 205 Z" fill="url(#goldGrad)"/>
    <circle cx="256" cy="205" r="5" fill="#0f0722"/>

    <!-- Crescent Moon -->
    <path d="M 252 245 A 14 14 0 0 0 266 268 A 17 17 0 1 1 252 245 Z" fill="#fef08a"/>
  </g>

  <!-- Astrological 8-Point Star Compass on Top -->
  <g transform="translate(330, 150) scale(0.8)" filter="url(#softGlow)">
    <polygon points="0,-24 6,-6 24,0 6,6 0,24 -6,6 -24,0 -6,-6" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
  <g transform="translate(180, 160) scale(0.55)">
    <polygon points="0,-20 5,-5 20,0 5,5 0,20 -5,5 -20,0 -5,-5" fill="url(#goldGrad)"/>
  </g>

  <!-- CRM Bottom Status Badge -->
  <g transform="translate(256, 410)">
    <rect x="-120" y="-22" width="240" height="44" rx="22" fill="#0c071a" stroke="#3b2762" stroke-width="2"/>
    <circle cx="-85" cy="0" r="6" fill="url(#emeraldGrad)"/>
    <text x="-65" y="6" fill="#f3effc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" letter-spacing="2">TAROT TN CRM</text>
  </g>

  <!-- Tiny Tunisia Flag Accent 🇹🇳 -->
  <circle cx="390" cy="410" r="14" fill="#e11d48"/>
  <circle cx="390" cy="410" r="8" fill="#ffffff"/>
  <circle cx="391" cy="410" r="6" fill="#e11d48"/>
  <circle cx="392" cy="410" r="4" fill="#ffffff"/>
  <polygon points="392,408 393,410 395,410 393.5,411 394,413 392,412 390.5,413 391,411 389.5,410 391.5,410" fill="#e11d48"/>
</svg>
