      - name: Test and build before committing
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit to existing main (Vercel deploys from there)
        shell: bash
        run: |
          set -euo pipefail
          git add src/components/Signup.tsx src/components/ClientEditor.tsx src/app/globals.css src/app/privacy/page.tsx tests/date-picker.test.ts
          if git diff --cached --quiet; then
            echo 'Already installed; no commit needed.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add iPhone DOB picker to Tarot TN CRM forms'
          git push origin HEAD:main
