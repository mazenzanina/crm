            git apply "$RUNNER_TEMP/compact-signup.patch"
          elif git apply --reverse --check "$RUNNER_TEMP/compact-signup.patch"; then
            echo 'Compact calendar and form are already installed. Nothing to change.'
          else
            echo 'CRM source has changed since this patch was tested. Stopping safely; nothing overwritten.' >&2
            exit 1
          fi
      - name: Typecheck, test, and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit verified CRM update
        shell: bash
        run: |
          set -euo pipefail
          git add src/components/Signup.tsx src/components/ClientEditor.tsx src/app/globals.css tests/date-picker.test.ts
          if git diff --cached --quiet; then
            echo 'Already installed; no commit needed.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Make Tarot TN signup full-screen and compact'
          git push origin HEAD:main
