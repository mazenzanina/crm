# Upload this YAML as .github/workflows/compact-signup-form.yml in mazenzanina/crm.
# It fixes the blank DOB box and makes the public CRM signup full-screen and responsive.
# No database migration, secrets, or WhatsApp automation are included.
name: Compact Tarot TN signup and calendar

on:
  push:
    branches: [main]
    paths: ['.github/workflows/compact-signup-form.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply verified compact calendar and full-screen form
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f src/components/Signup.tsx
          test -f src/components/ClientEditor.tsx
          test ! -e supabase/automatic-delivery.sql
